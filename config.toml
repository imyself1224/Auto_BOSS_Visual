# ============================================================
#  auto_boss 配置文件
#  改完直接生效，无需重启程序（每次运行都会重新读取）。
# ============================================================

[deepseek]
# API Key 从 .env 读取，不要把 key 直接写在这里。
api_key_env = "DEEPSEEK_API_KEY"
base_url    = "https://api.deepseek.com"
# 当前可用的模型只有这两个：
#   deepseek-flash    —— 支持视觉，本项目的视觉定位用它
#   deepseek-v4-pro   —— 不支持视觉
text_model   = "deepseek-flash"
vision_model = "deepseek-flash"
timeout_sec  = 120
# 关闭思维链可显著降低延迟；读卡、找按钮这种视觉任务不需要长推理。
# 如果发现视觉定位的 confidence 普遍偏低，可以设成 true 试试（代价是变慢）。
thinking     = false


# ============================================================
#  职位来源
# ============================================================
[source]
# "recommend" = 点搜索框旁边的「推荐」入口，用 BOSS 自己的推荐流
# "search"    = 用下面 [search].queries 里的关键词逐个搜索
# "both"      = 推荐流 + 逐个搜 queries（先后看下面的 recommend_last）
#
# 推荐流加了「求职类型→实习」后只有二三十个岗位，翻到页脚就没了，
# 想投到平台额度上限（约 150/天）必须靠关键词搜索补量。
mode = "both"
# true = 先逐个搜关键词，推荐流和求职期望标签放最后补漏。
# 实测（2026-10-17 截图）：推荐流加实习筛选后前几屏多是 SLAM / 机器人，对口的少；
# 搜「大模型算法」一屏 4 条全是对口实习（快手 / 字节 / 商汤 …）。
recommend_last = true
# 推荐流之后、关键词搜索之前，依次点开「推荐」旁边的这些求职期望标签
expect_tabs = ["算法工程师(北京)"]


[search]
# source.mode = "search" / "both" 时按顺序逐个搜。
# 按 resume/kb.md 的投递优先级排：最匹配 → 次匹配 → 可转投。
# 搜到的岗位照样过「实习 + 日薪 + 档位」所有筛选，关键词只决定去哪找。
#
# 临时只想搜几个词：QQ 上发「/投递 大模型算法 Agent」，或命令行
# `python run.py greet --keywords "大模型算法 Agent"`。这时**只搜这几个词**，
# 下面的 queries 和推荐流都不走；QQ 上发「/关键词 清空」恢复用这里的配置。
#
# 地址里已经带了「求职类型=实习」（下面的 job_type），所以关键词**不用再加「实习」**：
# 标题里没写实习、其实是实习的岗位（如「全栈工程师 4天/周」）也能搜到，池子更大。
queries = [
    # ---- 最匹配：大模型 / Agent / RAG ----
    "大模型算法", "大模型应用", "LLM", "Agent", "智能体", "RAG", "AIGC",
    "多模态", "大模型微调", "预训练", "对话系统",
    # ---- 最匹配：推荐 / 广告 / 搜索 ----
    "推荐算法", "广告算法", "搜索算法", "策略算法",
    # ---- 最匹配：具身 ----
    "具身智能", "VLA", "机器人算法",
    # ---- 宽口径：一次能捞出一大批，具体投不投交给档位判断 ----
    "暑期实习", "暑假实习", "日常实习", "算法实习", "AI实习",
    "算法工程师", "机器学习", "深度学习", "人工智能",
    # ---- 次匹配 ----
    "NLP", "知识图谱", "AI应用开发", "大模型数据", "数据挖掘",
    # ---- 产品 / 测试（最低日薪 ≥800 才高优先级；测试 800 以下按可转投）----
    "AI产品经理", "产品经理", "测试开发", "软件测试",
    # ---- 可转投 ----
    "后端开发", "Python开发", "Java开发", "全栈",
]
# 求职类型写进地址：1902 = 实习（实测点筛选器「求职类型→实习」后地址里就是 jobType=1902）。
# 每个来源一打开就是实习池，不用再去点筛选栏。留空 = 不带这个参数、照旧点筛选器。
job_type = "1902"
# 旧的单关键词写法；queries 为空时才用它。推荐流的起始地址也带着它。
query = "算法工程师"
# 城市代码：全国 100010000 / 北京 101010100 / 上海 101020100
#           广州 101280100 / 深圳 101280200 / 杭州 101210100 / 成都 101270100
#
# 注意：recommend 模式下也会带上这个城市参数，用来把推荐流限定在北京。
city  = "101010100"
pages = 3


# ============================================================
#  求职者画像（外接知识库）
# ============================================================
[resume]
# 这是一个普通 markdown 文件，**你自己维护**。程序只读它、从不改写它。
#
# 内容就是「哪种岗位可以投、优先投哪些」。每扫描一屏职位，这段文字会被
# 原样拼进提示词，让模型把岗位跟它逐条对比，判成
# 「最匹配 / 次匹配 / 可转投 / 产品 / 测试 / 不可用」六档（权重见下面 [job_filter] 的 fit_scores）。
#
# 想改投递范围、加岗位族、调优先级 —— 直接改这个文件，下次运行立即生效。
kb_path = "resume/kb.md"


# ============================================================
#  职位筛选
#  ——  硬性条件：不满足就不打招呼（省配额）
#  ——  优先排序：只影响先后顺序，不排除
# ============================================================
[job_filter]
# ---- 先用 BOSS 自带的筛选器把池子换对 ----
# 这一步不能省。推荐流给的是跟"求职意向"匹配的岗位，实际绝大多数是全职岗；
# 只靠下面的卡片级过滤，结果就是把看到的一条条全滤掉，一条都发不出去。
#
# 格式：[["筛选器名称", "要选的选项"], ...]
# 筛选栏上可用的有：求职类型 / 薪资待遇 / 工作经验 / 学历要求 / 公司行业 / 公司规模
# （薪资待遇不在这里设 —— BOSS 给的是固定档位，没法表达"日薪中位≥300"，
#   这个精确条件交给下面的卡片级过滤，它读的是卡上真实数字。）
boss_filters = [
    ["求职类型", "实习"],
]

# ---- 硬性条件 ----
require_internship  = true     # 只要实习岗。通过阅读职位标题/标签判断，不只是看筛选器
min_daily_wage      = 300      # 日薪下限（元/天）
# 岗位要求的学历区间：要求落在 [最低, 最高] 之间才投；"不限" = 该边界不设限。
# 「学历不限」的岗位按最低档算 —— 想保留就把最低写成 不限。
# 卡片上读不出学历的照旧放行。可写 不限 / 大专 / 本科 / 硕士 / 博士。
# QQ 上「/学历 不限 硕士」可以覆盖，设定值存在 .qq_prefs.json（不在仓库里），
# 下次任务继续沿用；发「/配置」看当前生效的条件。
education_min       = "不限"
education_max       = "不限"
allow_unparsable    = false    # 薪资读不出来时（如"面议"）是否照发。false = 跳过
require_city        = "北京"    # 工作地点必须包含这两个字；地点读不到时不拦

# 月薪 → 日薪的折算除数。
# 21.75 是国家规定的月计薪天数（(365-104)/12），也是 HR 圈的通用算法。
# BOSS 上的实习岗绝大多数直接写「元/天」，这个只在少数写月薪的岗位上生效。
work_days_per_month = 21.75

# ---- 档位权重（软条件，只影响排序，不排除）----
#
# 模型把每个岗位跟 resume/kb.md 逐条对比，判成六档。
# 这里给前三档定排序分，**表里没有的档位 = 不打招呼**（所以「不可用」不在表里）。
# 想调整各档的先后，改这里的数字就行，不用动提示词。
fit_scores = { "最匹配" = 3.0, "次匹配" = 2.0, "可转投" = 1.0, "产品" = 3.0, "测试" = 3.0 }
# 有门槛的档位：日薪区间的**最低值**达到这个数，才按上面 fit_scores 里本档的分投
# （上面的日薪中位 ≥300 照样要满足）。
fit_min_low_wage = { "产品" = 800, "测试" = 800 }
# 达不到门槛时降到哪一档。没写 = 不投。
#   测试：最低 ≥800 跟最匹配一样优先；800 以下降成可转投，照旧投
#   产品：800 以下不投
fit_fallback = { "测试" = "可转投" }

# ---- 地点软排序（只加分，不排除）----
# 海淀优先，但不排除北京其他区 —— 很多岗位只写「北京」不写具体区，
# 硬卡海淀会漏掉一批实际在海淀的好机会。清空这个列表 = 不看地点。
prefer_districts     = ["海淀区", "海淀"]
prefer_district_bonus = 1.0


# ============================================================
#  浏览器
# ============================================================
[browser]
# 留空则自动探测 Edge → Chrome。Edge 是 Chromium 内核，CDP 完全兼容。
executable_path = ""
cdp_port        = 9222
# 留空则使用 <项目目录>/browser_profile，独立于你日常浏览器的干净 profile。
user_data_dir   = ""
viewport_width  = 1600
viewport_height = 900


# ============================================================
#  限流 —— 安全阀，建议不要调松
# ============================================================
[limits]
# 每日打招呼条数的**本地上限（兜底用）**。
#
# 这不是平台上限 —— BOSS 的额度由平台自己控制，用尽时会弹提示，
# 程序检测到「今日主动沟通数已达上限」「开聊次数已用完」这类字样会**立即停机**。
#
# 所以这里设成比平台额度（约 150/天）略高即可，让平台成为真正的约束，
# 而这个数字只在程序出 bug 时当最后一道闸 —— 别设成天文数字，
# 那样就真的没人拦得住了。
daily_cap         = 200
# 两次打招呼之间的随机间隔（秒）。社区经验值 ≥5s，这里默认更保守。
# 间隔用三角分布取随机值，比均匀分布更接近真人。
min_interval_sec  = 25
max_interval_sec  = 60
# 同一个来源里连续多少屏挑不出合适的职位，就换下一个来源。
# 推荐流是无限滚动，往下翻通常还有新的；调小会过早结束，调大则会在
# 真的没职位时空转、白烧 token。
max_empty_scans   = 6
# 同一个关键词**连续**多少屏都是新岗位、却一个都不能投，就提前跳过这个词、
# 换下一个（按来源分别计数，换关键词清零）。
# 注意：同一屏也会计入 max_empty_scans；默认 6 比这里小，所以每个关键词
# 一般先被 max_empty_scans 收口。想更早放弃"全是新岗位但都不合格"的词，
# 把这里调到比 max_empty_scans 小（例如 3）。
#
# ★ 以前这里是整个任务累计、换关键词不清零 ★：2026-10-21 22:00 那次，
#   「大模型算法」6 屏 + 「大模型应用」2 屏全是日薪不够的，凑满 8 屏就整轮
#   收工了，后面 40 个关键词一个都没试到。一个词没货只说明这个词没货，
#   不代表整个市场没岗位。
max_dry_scans     = 8
# 连续多少个来源（关键词 / 推荐流）一条都没投出去才结束整个任务，通过 QQ 汇报。
# 0 = 不限，把 [search].queries 全部走完（推荐）。
# 关键词很多、想省模型调用时设成 10~15：跑完这么多个词都没货就先停，
# 过段时间新岗位上来了再投。
max_dry_sources   = 0
# 只在 [起, 止) 点之间运行。[0, 24] = 不限时段（按你的要求放开）。
# 想收紧就改回 [9, 21] —— 凌晨批量操作是最容易被风控标记的行为之一。
active_hours      = [0, 24]


[safety]
# true = 演练：只筛选、打印会投哪些岗位，绝不真的点「立即沟通」。
# 第一次跑务必保持 true，先看筛选结果满不满意。
dry_run         = true
# 遇到滑块验证 / security-check 时立即停机交还人工，不尝试绕过。
stop_on_captcha = true


# ============================================================
#  QQ 机器人（可选）—— 小号推送投递结果给大号，大号发指令遥控
#  用法见 README「QQ 机器人」
# ============================================================
[qq]
enabled     = true
# 小号上跑的 OneBot v11 实现（SnowLuma / NapCat / LLOneBot / Lagrange）开的「正向 WebSocket」地址
ws_url      = "ws://127.0.0.1:3001"
# access token 放 .env，不写在这里
access_token_env = "ONEBOT_TOKEN"
# 你的大号 QQ 号。只有它发来的私聊会被当成指令，别人发的一律不理。
# QQ 号属于个人信息，放 .env（OWNER_QQ=123456），这里保持 0；直接写在这里也行，但别提交。
owner_qq    = 0
owner_qq_env = "OWNER_QQ"
# 每投出一条就推一条。false = 只推停机/出错这种需要你知道的事
notify_each = true
# run.py bot 启动时自动拉起 SnowLuma 和 QQ（已经在跑的不会重复开）。
# 自己手动开的话设 false。
auto_launch  = true
# SnowLuma 解压目录，相对路径按项目根目录算
snowluma_dir = "SnowLuma"
# SnowLuma WebUI 端口：靠它判断 SnowLuma 是不是已经开着
snowluma_webui_port = 5099
qq_path      = 'C:\Program Files\Tencent\QQNT\QQ.exe'
