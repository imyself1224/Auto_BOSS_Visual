# ============================================================
#  auto_boss 配置文件
#  改完直接生效，无需重启程序（每次运行都会重新读取）。
# ============================================================

[deepseek]
# API Key 从 .env 读取，不要把 key 直接写在这里。
api_key_env = "DEEPSEEK_API_KEY"
base_url    = "https://api.deepseek.com"
# 当前可用的模型只有这两个：
#   deepseek-flash    —— 支持视觉，本项目的视觉定位用它
#   deepseek-v4-pro   —— 不支持视觉
text_model   = "deepseek-flash"
vision_model = "deepseek-flash"
timeout_sec  = 120
# 关闭思维链可显著降低延迟；招呼语这种任务不需要长推理。
# 如果发现视觉定位的 confidence 普遍偏低，可以设成 true 试试（代价是变慢）。
thinking     = false


# ============================================================
#  你的个人背景 —— AI 写招呼语时唯一的素材来源。
#  ★★ 这段目前是占位内容，务必改成你自己的真实经历。★★
#  写得越具体，招呼语越像人写的、越不像群发模板。
# ============================================================
[profile]
name        = "张三"
# 找实习的话，工作年限填 0
years       = 0
target_role = "算法实习生（推荐算法 / Agent 方向）"
city        = "北京"

skills = ["Python", "PyTorch", "推荐系统", "LLM", "RAG", "Agent"]

# ★ 换成你的真实项目/成绩，尽量带数字 ★
highlights = [
    "校内实验室做过推荐系统项目，用双塔召回把离线 Recall@10 从 0.21 提到 0.34",
    "复现过一个 RAG + Agent 的问答系统，写了完整的评测流程",
]

# 学校、专业、可实习时间等。实习岗 HR 很在意「一周能来几天、能实习多久」，
# 建议写进来，能显著提高回复率。
extra = "某大学计算机专业在读，可实习 6 个月，每周到岗 5 天"


# ============================================================
#  职位来源
# ============================================================
[source]
# "recommend" = 点搜索框旁边的「推荐」入口，用 BOSS 自己的推荐流
# "search"    = 用下面 [search].queries 里的关键词逐个搜索
# "both"      = 先走推荐流，走完再逐个搜 queries
#
# 推荐流加了「求职类型→实习」后只有二三十个岗位，翻到页脚就没了，
# 想投到平台额度上限（约 150/天）必须靠关键词搜索补量。
mode = "both"
# 推荐流之后、关键词搜索之前，依次点开「推荐」旁边的这些求职期望标签
expect_tabs = ["算法工程师(北京)"]


[search]
# source.mode = "search" / "both" 时按顺序逐个搜。
# 按 resume/kb.md 的投递优先级排：最匹配 → 次匹配 → 可转投。
# 搜到的岗位照样过「实习 + 日薪 + 档位」所有筛选，关键词只决定去哪找。
queries = [
    "大模型算法实习", "大模型应用实习", "Agent实习", "RAG实习", "推荐算法实习",
    "NLP实习", "AI应用开发实习", "大模型数据实习",
    "后端开发实习", "测试开发实习",
]
# 旧的单关键词写法；queries 为空时才用它。推荐流的起始地址也带着它。
query = "算法工程师"
# 城市代码：全国 100010000 / 北京 101010100 / 上海 101020100
#           广州 101280100 / 深圳 101280200 / 杭州 101210100 / 成都 101270100
#
# 注意：recommend 模式下也会带上这个城市参数，用来把推荐流限定在北京。
city  = "101010100"
pages = 3


# ============================================================
#  求职者画像（外接知识库）
# ============================================================
[resume]
# 这是一个普通 markdown 文件，**你自己维护**。程序只读它、从不改写它。
#
# 内容就是「哪种岗位可以投、优先投哪些」。每扫描一屏职位，这段文字会被
# 原样拼进提示词，让模型把岗位跟它逐条对比，判成
# 「最匹配 / 次匹配 / 可转投 / 不可用」四档（权重见下面 [job_filter] 的 fit_scores）。
#
# 想改投递范围、加岗位族、调优先级 —— 直接改这个文件，下次运行立即生效。
kb_path = "resume/kb.md"


# ============================================================
#  职位筛选
#  ——  硬性条件：不满足就不打招呼（省配额）
#  ——  优先排序：只影响先后顺序，不排除
# ============================================================
[job_filter]
# ---- 先用 BOSS 自带的筛选器把池子换对 ----
# 这一步不能省。推荐流给的是跟"求职意向"匹配的岗位，实际绝大多数是全职岗；
# 只靠下面的卡片级过滤，结果就是把看到的一条条全滤掉，一条都发不出去。
#
# 格式：[["筛选器名称", "要选的选项"], ...]
# 筛选栏上可用的有：求职类型 / 薪资待遇 / 工作经验 / 学历要求 / 公司行业 / 公司规模
# （薪资待遇不在这里设 —— BOSS 给的是固定档位，没法表达"日薪中位≥300"，
#   这个精确条件交给下面的卡片级过滤，它读的是卡上真实数字。）
boss_filters = [
    ["求职类型", "实习"],
]

# ---- 硬性条件 ----
require_internship  = true     # 只要实习岗。通过阅读职位标题/标签判断，不只是看筛选器
min_daily_wage      = 300      # 日薪下限（元/天）
allow_unparsable    = false    # 薪资读不出来时（如"面议"）是否照发。false = 跳过
require_city        = "北京"    # 工作地点必须包含这两个字；地点读不到时不拦

# 月薪 → 日薪的折算除数。
# 21.75 是国家规定的月计薪天数（(365-104)/12），也是 HR 圈的通用算法。
# BOSS 上的实习岗绝大多数直接写「元/天」，这个只在少数写月薪的岗位上生效。
work_days_per_month = 21.75

# ---- 档位权重（软条件，只影响排序，不排除）----
#
# 模型把每个岗位跟 resume/kb.md 逐条对比，判成四档。
# 这里给前三档定排序分，**表里没有的档位 = 不打招呼**（所以「不可用」不在表里）。
# 想调整各档的先后，改这里的数字就行，不用动提示词。
fit_scores = { "最匹配" = 3.0, "次匹配" = 2.0, "可转投" = 1.0 }

# ---- 地点软排序（只加分，不排除）----
# 海淀优先，但不排除北京其他区 —— 很多岗位只写「北京」不写具体区，
# 硬卡海淀会漏掉一批实际在海淀的好机会。清空这个列表 = 不看地点。
prefer_districts     = ["海淀区", "海淀"]
prefer_district_bonus = 1.0


# ============================================================
#  招呼语
# ============================================================
[greeting]
style     = "简洁、专业、符合学生身份，突出项目经历与岗位方向的技术匹配度，不要夸大"
max_chars = 90

# ★ 关掉 ★
#
# 这个开关控制「点完立即沟通之后，要不要再进聊天页补发一条 AI 生成的话术」。
# 实测打开它的效果是：对方会先收到平台的默认招呼语，紧接着又收到一条你写的长消息。
# 那相当于替你多说了句话，不是「打招呼」该有的行为，而且更像群发机器人的动作。
#
# 关掉之后，程序只做一件事：点「立即沟通」。
# 平台会自动发出它自己的招呼语并附上你的在线简历 —— 这就是 BOSS 上「打招呼」的完整含义。
# 后续对话由你自己接管，程序不碰。
#
# 注意：关掉不影响 DeepSeek 的作用。模型仍然负责所有的视觉定位
# （找按钮、读职位卡、读薪资、判断实习还是全职），那才是它在这个项目里的主要工作。
send_custom_message = false


# ============================================================
#  浏览器
# ============================================================
[browser]
# 留空则自动探测 Edge → Chrome。Edge 是 Chromium 内核，CDP 完全兼容。
executable_path = ""
cdp_port        = 9222
# 留空则使用 <项目目录>/browser_profile，独立于你日常浏览器的干净 profile。
user_data_dir   = ""
viewport_width  = 1600
viewport_height = 900


# ============================================================
#  限流 —— 安全阀，建议不要调松
# ============================================================
[limits]
# 每日打招呼条数的**本地上限（兜底用）**。
#
# 这不是平台上限 —— BOSS 的额度由平台自己控制，用尽时会弹提示，
# 程序检测到「今日主动沟通数已达上限」「开聊次数已用完」这类字样会**立即停机**。
#
# 所以这里设成比平台额度（约 150/天）略高即可，让平台成为真正的约束，
# 而这个数字只在程序出 bug 时当最后一道闸 —— 别设成天文数字，
# 那样就真的没人拦得住了。
daily_cap         = 200
# 两次打招呼之间的随机间隔（秒）。社区经验值 ≥5s，这里默认更保守。
# 间隔用三角分布取随机值，比均匀分布更接近真人。
min_interval_sec  = 25
max_interval_sec  = 60
# 连续多少屏挑不出合适的职位才收工。推荐流是无限滚动，往下翻通常还有新的，
# 调小会过早结束，调大则会在真的没职位时空转、白烧 token。
max_empty_scans   = 6
# 只在 [起, 止) 点之间运行。[0, 24] = 不限时段（按你的要求放开）。
# 想收紧就改回 [9, 21] —— 凌晨批量操作是最容易被风控标记的行为之一。
active_hours      = [0, 24]


[safety]
# true = 只生成招呼语并打印，绝不真的点发送。
# 第一次跑务必保持 true，先把话术质量调满意。
dry_run         = true
# 遇到滑块验证 / security-check 时立即停机交还人工，不尝试绕过。
stop_on_captcha = true
